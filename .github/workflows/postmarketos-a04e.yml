name: postmarketOS A04e

on:
  push:
    branches: [postmarketos-a04e]
  pull_request:
    branches: [postmarketos-a04e]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv qemu-user-static binfmt-support

      - name: Install pmbootstrap
        run: |
          set -euxo pipefail
          git clone --depth=1 https://gitlab.postmarketOS.org/postMarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          cd "$RUNNER_TEMP/pmbootstrap"
          python3 -m pip install --user --break-system-packages .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap --version

      - name: Prepare local pmaports
        run: |
          set -euxo pipefail
          git clone --depth=1 https://gitlab.postmarketOS.org/postMarketOS/pmaports.git pmaports
          mkdir -p pmaports/device/testing/device-samsung-a04e
          mkdir -p pmaports/device/testing/linux-samsung-a04e
          cp postmarketos/device/testing/device-samsung-a04e/* pmaports/device/testing/device-samsung-a04e/
          cp postmarketos/device/testing/linux-samsung-a04e/* pmaports/device/testing/linux-samsung-a04e/

      - name: Verify required kernel configuration
        run: |
          set -euxo pipefail
          grep -qx 'CONFIG_DEVTMPFS=y' postmarketos/device/testing/linux-samsung-a04e/config-samsung-a04e.aarch64
          grep -qx 'CONFIG_DEVTMPFS_MOUNT=y' postmarketos/device/testing/linux-samsung-a04e/config-samsung-a04e.aarch64

      - name: Initialize postmarketOS
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          PMB_WORK="$RUNNER_TEMP/pmos-work"
          PMB_APORTS="$PWD/pmaports"
          mkdir -p "$PMB_WORK"
          printf '%s\n' '' '' v26.06 samsung a04e downstream | pmbootstrap --work "$PMB_WORK" --aports "$PMB_APORTS" init --shallow-initial-clone
          pmbootstrap --work "$PMB_WORK" --aports "$PMB_APORTS" status

      - name: Build A04e kernel package with pmbootstrap
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap --aports "$PWD/pmaports" --work "$RUNNER_TEMP/pmos-work" build linux-samsung-a04e --arch aarch64

      - name: Build postmarketOS initramfs/rootfs
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap --aports "$PWD/pmaports" --work "$RUNNER_TEMP/pmos-work" install --no-fde --no-sshd --no-image
          pmbootstrap --aports "$PWD/pmaports" --work "$RUNNER_TEMP/pmos-work" export

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find "$RUNNER_TEMP/pmos-work" -type f \( -name '*.apk' -o -name '*.img' -o -name '*.gz' -o -name '*.cpio*' \) -exec cp --parents {} artifacts/ \; || true
          find artifacts -type f -print

      - name: Upload postmarketOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-a04e
          path: artifacts/
          if-no-files-found: error
