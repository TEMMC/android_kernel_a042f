name: Build postmarketOS A04e image

on:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A04e source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv openssl xz-utils zstd qemu-user-static binfmt-support rsync e2fsprogs

      - name: Install current pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Configure ARM64 postmarketOS
        run: |
          set -eux
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$WORK/cache_git/pmaports"
          CONFIG="$RUNNER_TEMP/pmbootstrap-aarch64.cfg"
          mkdir -p "$WORK/cache_git"
          printf '%s\n' '8' > "$WORK/version"
          cat > "$CONFIG" <<EOF
[pmbootstrap]
aports = $APORTS
work = $WORK
device = qemu-aarch64
kernel = stable
user = root
ui = console
extra_packages = openssh,networkmanager
build_pkgs_on_install = False
is_default_channel = False
locale = en_US.UTF-8
mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
mirrors_postmarketOS = http://mirror.postmarketos.org/postmarketos/
nonfree_firmware = False
nonfree_userland = False
ssh_keys = False
[providers]
[pmaports]
supported_arches = aarch64
EOF
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmaports.git "$APORTS"
          pmbootstrap -c "$CONFIG" -p "$APORTS" install --no-image --filesystem ext4 --add "openssh,networkmanager"

      - name: Package final ARM64 filesystem image
        run: |
          set -eux
          ROOTFS="$(find "$RUNNER_TEMP/pmbootstrap-work" -maxdepth 1 -type d -name 'chroot_rootfs_qemu-aarch64' | head -n1)"
          test -n "$ROOTFS"
          test -f "$ROOTFS/etc/os-release"
          mkdir -p out
          sudo tar -C "$ROOTFS" -cJf out/postmarketos-a04e-arm64-rootfs.tar.xz .
          sudo chown "$USER":"$USER" out/postmarketos-a04e-arm64-rootfs.tar.xz
          sha256sum out/postmarketos-a04e-arm64-rootfs.tar.xz

      - name: Upload postmarketOS filesystem
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-A04e-final-filesystem
          path: out/postmarketos-a04e-arm64-rootfs.tar.xz
          if-no-files-found: error
          retention-days: 30
