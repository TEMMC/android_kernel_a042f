name: Build A04e native postmarketOS bundle

on:
  push:
    branches:
      - a04e
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A04e source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install image build tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip xz-utils e2fsprogs rsync android-sdk-libsparse-utils file openssl tar unzip curl jq

      - name: Download latest successful kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          ID="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$API" | jq -r '[.artifacts[] | select(.expired == false) | select(.name | startswith("KernelSU-Next-SM-A042F-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ID" && test "$ID" != null
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -o kernel.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip"
          mkdir -p work/kernel
          unzip -q kernel.zip -d work/kernel
          tar -xf work/kernel/*.tar -C work/kernel
          test -s work/kernel/boot.img

      - name: Download latest successful rootfs artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          ID="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$API" | jq -r '[.artifacts[] | select(.expired == false) | select(.name == "postmarketOS-A04e-ARM64-rootfs")] | sort_by(.created_at) | last | .id')"
          test -n "$ID" && test "$ID" != null
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -o rootfs.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip"
          mkdir -p work/rootfs
          unzip -q rootfs.zip -d work/rootfs
          ROOTFS_TAR="$(find work/rootfs -type f -name '*.tar.xz' | head -n1)"
          test -s "$ROOTFS_TAR"
          xz -t "$ROOTFS_TAR"
          cp "$ROOTFS_TAR" work/rootfs.tar.xz

      - name: Download and verify stock boot
        run: |
          set -eux
          mkdir -p work out
          curl -fL -o work/stock-boot.img "https://github.com/TEMMC/android_kernel_a042f/releases/download/a04e-stock-boot-20260929/A04e-stock-boot.img"
          echo "797db41a6d3cfe9056db60e841b852c76206b01d4715ff58331f2b8b9fc86a80  work/stock-boot.img" | sha256sum -c -

      - name: Extract compiled kernel and modules from kernel artifact
        run: |
          set -eux
          rm -rf work/kernel-aik
          cp -a AIK-Linux work/kernel-aik
          cd work/kernel-aik
          sudo ./unpackimg.sh ../kernel/boot.img
          sudo chown -R "$(id -u):$(id -g)" split_img ramdisk
          KERNEL_FILE="$(find split_img -maxdepth 1 -type f -name '*-kernel' | head -n1)"
          test -s "$KERNEL_FILE"
          cp "$KERNEL_FILE" ../../work/compiled-kernel
          test -s ../../work/compiled-kernel
          test -s ../kernel/kernel-release.txt
          KREL="$(cat ../kernel/kernel-release.txt)"
          test -d "../kernel/modules/lib/modules/$KREL"
          find "../kernel/modules/lib/modules/$KREL" -type f -name '*.ko' | grep -q .
          sha256sum ../../work/compiled-kernel
          cd ../..

      - name: Create USERDATA rootfs image
        run: |
          set -eux
          truncate -s 6G out/A04e-postmarketOS-rootfs.img
          mkfs.ext4 -F -L PMOSROOT out/A04e-postmarketOS-rootfs.img
          sudo mkdir -p /mnt/a04e-rootfs
          sudo mount -o loop out/A04e-postmarketOS-rootfs.img /mnt/a04e-rootfs
          sudo tar -xJf work/rootfs.tar.xz -C /mnt/a04e-rootfs
          KREL="$(cat work/kernel/kernel-release.txt)"
          sudo mkdir -p "/mnt/a04e-rootfs/lib/modules/${KREL}"
          sudo cp -a "work/kernel/modules/lib/modules/${KREL}/." "/mnt/a04e-rootfs/lib/modules/${KREL}/"
          sudo test -n "$(find "/mnt/a04e-rootfs/lib/modules/${KREL}" -type f -name "*.ko" -print -quit)"
          sudo mkdir -p /mnt/a04e-rootfs/proc /mnt/a04e-rootfs/sys /mnt/a04e-rootfs/dev /mnt/a04e-rootfs/run
          sync
          sudo umount /mnt/a04e-rootfs
          e2fsck -fy out/A04e-postmarketOS-rootfs.img
          img2simg out/A04e-postmarketOS-rootfs.img out/A04e-postmarketOS-rootfs-sparse.img
          xz -T0 -9 -c out/A04e-postmarketOS-rootfs.img > out/A04e-postmarketOS-rootfs.img.xz
          xz -T0 -9 -c out/A04e-postmarketOS-rootfs-sparse.img > out/A04e-postmarketOS-rootfs-sparse.img.xz

      - name: Build native postmarketOS boot image
        run: |
          set -eux
          rm -rf work/aik
          cp -a AIK-Linux work/aik
          cd work/aik
          sudo ./unpackimg.sh ../stock-boot.img
          sudo chown -R "$(id -u):$(id -g)" split_img ramdisk
          HEADER_FILE=$(find split_img -maxdepth 1 -type f -name '*-header_version' | head -n1)
          PAGESIZE_FILE=$(find split_img -maxdepth 1 -type f -name '*-pagesize' | head -n1)
          CMDLINE_FILE=$(find split_img -maxdepth 1 -type f -name '*-cmdline' | head -n1)
          KERNEL_FILE=$(find split_img -maxdepth 1 -type f -name '*-kernel' | head -n1)
          test -s "$HEADER_FILE"
          test -s "$PAGESIZE_FILE"
          test -s "$CMDLINE_FILE"
          test -s "$KERNEL_FILE"
          test "$(cat "$HEADER_FILE")" = 2
          test "$(cat "$PAGESIZE_FILE")" = 2048
          cp ../../work/compiled-kernel "$KERNEL_FILE"
          test -s "$KERNEL_FILE"
          echo "Compiled kernel installed into native boot image:"
          sha256sum ../../work/compiled-kernel "$KERNEL_FILE"
          mkdir -p ramdisk/sbin
          cp "$(command -v busybox)" ramdisk/sbin/busybox
          chmod 0755 ramdisk/sbin/busybox
          [ -f ramdisk/init ] && mv ramdisk/init ramdisk/android-init || true
          cp ../../native-initramfs/a04e-init ramdisk/init
          chmod 0755 ramdisk/init
          CMD="$(cat "$CMDLINE_FILE")"
          case " $CMD " in *" androidboot.selinux="*) ;; *) CMD="$CMD androidboot.selinux=permissive" ;; esac
          case " $CMD " in *" firmware_class.path="*) ;; *) CMD="$CMD firmware_class.path=/lib/firmware" ;; esac
          printf '%s\n' "$CMD" > "$CMDLINE_FILE"
          ./repackimg.sh --nosudo --origsize
          test -s image-new.img
          mv image-new.img ../../out/A04e-postmarketOS-boot.img
          cd ../..
          file out/A04e-postmarketOS-boot.img
          test "$(stat -c %s out/A04e-postmarketOS-boot.img)" -le 33554432
          sha256sum out/A04e-postmarketOS-boot.img

      - name: Verify boot image
        run: |
          set -eux
          rm -rf work/verify
          cp -a AIK-Linux work/verify
          cd work/verify
          sudo ./unpackimg.sh ../../out/A04e-postmarketOS-boot.img > ../../out/boot-verify.txt 2>&1
          grep -E 'Image type:|Done!' ../../out/boot-verify.txt
          HEADER_FILE=$(find split_img -maxdepth 1 -type f -name '*-header_version' | head -n1)
          PAGESIZE_FILE=$(find split_img -maxdepth 1 -type f -name '*-pagesize' | head -n1)
          KERNEL_FILE=$(find split_img -maxdepth 1 -type f -name '*-kernel' | head -n1)
          test "$(cat "$HEADER_FILE")" = 2
          test "$(cat "$PAGESIZE_FILE")" = 2048
          test -s "$KERNEL_FILE"
          test -x ramdisk/init
          grep -q 'switching to native postmarketOS' ramdisk/init
          cmp ../../work/compiled-kernel "$KERNEL_FILE"
          cd ../..
          sha256sum out/A04e-postmarketOS-boot.img > out/SHA256SUMS
          sha256sum out/A04e-postmarketOS-rootfs.img.xz >> out/SHA256SUMS
          sha256sum out/A04e-postmarketOS-rootfs-sparse.img.xz >> out/SHA256SUMS
          {
            stat -c "%n %s bytes" out/A04e-postmarketOS-boot.img
            stat -c "%n %s bytes" out/A04e-postmarketOS-rootfs.img.xz
            stat -c "%n %s bytes" out/A04e-postmarketOS-rootfs-sparse.img.xz
            stat -c "%n %s bytes" out/SHA256SUMS
          } | tee out/artifact-sizes.txt

      - name: Upload native postmarketOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: A04e-native-postmarketOS-bootable-bundle
          path: |
            out/A04e-postmarketOS-boot.img
            out/A04e-postmarketOS-rootfs.img.xz
            out/A04e-postmarketOS-rootfs-sparse.img.xz
            out/SHA256SUMS
            out/artifact-sizes.txt
          if-no-files-found: error
          retention-days: 30
