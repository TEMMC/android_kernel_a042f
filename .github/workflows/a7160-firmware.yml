name: A7160 ZCS8FXA1 firmware to GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip p7zip-full
          python3 -m pip install --break-system-packages git+https://github.com/t0rzz/SamLoader-Reloaded.git

      - name: Get exact Samsung firmware version
        run: |
          set -euxo pipefail
          samloader -m SM-A7160 -r CHC checkupdate --raw | tee version.txt
          grep -q 'A7160ZCS8FXA1' version.txt
          VERSION="$(grep 'A7160ZCS8FXA1' version.txt | head -n1 | tr -d '\r')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download exact firmware
        run: |
          set -euxo pipefail
          mkdir -p firmware
          samloader -m SM-A7160 -r CHC download -v "$VERSION" -O firmware -T 8 --retries 20
          FW="$(find firmware -maxdepth 1 -type f -print -quit)"
          test -n "$FW"
          echo "FW=$FW" >> "$GITHUB_ENV"
          ls -lh "$FW"

      - name: Compress firmware
        run: |
          set -euxo pipefail
          mkdir -p release
          7z a -t7z -mx=9 -m0=lzma2 -md=256m release/A7160ZCS8FXA1.7z "$FW"
          sha256sum release/A7160ZCS8FXA1.7z > release/SHA256SUMS
          ls -lh release/A7160ZCS8FXA1.7z

      - name: Split only if over GitHub limit
        run: |
          set -euxo pipefail
          SIZE="$(stat -c%s release/A7160ZCS8FXA1.7z)"
          if [ "$SIZE" -ge 1900000000 ]; then
            mkdir -p release/parts
            split -b 1800M -d -a 2 release/A7160ZCS8FXA1.7z release/parts/A7160ZCS8FXA1.7z.part-
            rm release/A7160ZCS8FXA1.7z
            sha256sum release/parts/* > release/parts/SHA256SUMS
          fi
          find release -type f -printf '%p %s bytes\n'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="A7160ZCS8FXA1-compressed"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          if [ -f release/A7160ZCS8FXA1.7z ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SM-A7160 A7160ZCS8FXA1 compressed firmware" --notes "Exact Samsung SM-A7160 CHC A7160ZCS8FXA1 firmware." --latest=false release/SHA256SUMS release/A7160ZCS8FXA1.7z
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SM-A7160 A7160ZCS8FXA1 compressed firmware" --notes "Exact Samsung SM-A7160 CHC A7160ZCS8FXA1 firmware. Concatenate parts in numeric order before extraction." --latest=false release/SHA256SUMS release/parts/*
          fi
