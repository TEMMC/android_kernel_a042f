name: Build A04e First Boot Tools

on:
  push:
    branches:
      - a04e
    paths:
      - ".github/workflows/build-a04e-tools.yml"
  workflow_dispatch:

jobs:
  build-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Create tools bundle
        run: |
          set -eux
          mkdir -p bundle
          cat > bundle/packages.txt <<'EOF'
bash
curl
wget
git
nano
vim
tar
unzip
zip
xz
gzip
bzip2
file
rsync
lsof
procps
htop
util-linux
e2fsprogs
iproute2
usbutils
pciutils
openssh-client
ca-certificates
mpv
zathura
zathura-pdf-poppler
imv
EOF
          cat > bundle/install.sh <<'EOF'
#!/bin/sh
set -eu
[ "$(id -u)" -eq 0 ] || { echo "Run as root: ./install.sh"; exit 1; }
command -v apk >/dev/null 2>&1 || { echo "ERROR: apk not found; this is for postmarketOS/Alpine"; exit 1; }
cd "$(dirname "$0")"
apk update
xargs apk add --no-cache < packages.txt
echo "A04e first-boot tools installed successfully."
EOF
          chmod +x bundle/install.sh
          tar -czf A04e-first-boot-tools.tar.gz -C bundle .
          sha256sum A04e-first-boot-tools.tar.gz > A04e-first-boot-tools.tar.gz.sha256
          test -s A04e-first-boot-tools.tar.gz

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: A04e-first-boot-tools
          path: |
            A04e-first-boot-tools.tar.gz
            A04e-first-boot-tools.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
