name: A04e First Boot Tools

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-a04e-first-boot-tools-v2.yml"

jobs:
  build:
    name: Build A04e first-boot tools
    runs-on: ubuntu-latest
    steps:
      - name: Create package list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cat > bundle/packages.txt <<'EOF'
bash
curl
wget
git
nano
vim
tar
unzip
zip
xz
gzip
bzip2
file
rsync
lsof
procps
htop
util-linux
e2fsprogs
iproute2
usbutils
pciutils
openssh-client
ca-certificates
mpv
zathura
zathura-pdf-poppler
imv
EOF

      - name: Create installer
        shell: bash
        run: |
          set -euo pipefail
          cat > bundle/install.sh <<'EOF'
#!/bin/sh
set -eu

if [ "$(id -u)" -ne 0 ]; then
  echo "Run as root: ./install.sh"
  exit 1
fi

if ! command -v apk >/dev/null 2>&1; then
  echo "ERROR: apk was not found. This bundle is for postmarketOS/Alpine Linux."
  exit 1
fi

cd "$(dirname "$0")"
apk update
xargs apk add --no-cache < packages.txt
echo "A04e first-boot tools installed successfully."
EOF
          chmod +x bundle/install.sh

      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf A04e-first-boot-tools.tar.gz -C bundle .
          sha256sum A04e-first-boot-tools.tar.gz > A04e-first-boot-tools.tar.gz.sha256
          test -s A04e-first-boot-tools.tar.gz
          test -s A04e-first-boot-tools.tar.gz.sha256
          ls -lh A04e-first-boot-tools.tar.gz A04e-first-boot-tools.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A04e-first-boot-tools
          path: |
            A04e-first-boot-tools.tar.gz
            A04e-first-boot-tools.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
