name: Build A04e First-Boot Tools

on:
  workflow_dispatch:

jobs:
  build:
    name: Build tools bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Create package list
        run: |
          set -eu
          mkdir -p bundle
          cat > bundle/packages.txt <<'EOF'
bash
curl
wget
git
nano
vim
tar
unzip
zip
xz
gzip
bzip2
file
rsync
lsof
procps
htop
util-linux
e2fsprogs
iproute2
usbutils
pciutils
openssh-client
ca-certificates
mpv
zathura
zathura-pdf-poppler
imv
EOF

      - name: Create installer
        run: |
          set -eu
          cat > bundle/install.sh <<'EOF'
#!/bin/sh
set -eu

if [ "$(id -u)" -ne 0 ]; then
  echo "Run as root: ./install.sh"
  exit 1
fi

if ! command -v apk >/dev/null 2>&1; then
  echo "ERROR: apk was not found. This bundle is for postmarketOS/Alpine Linux."
  exit 1
fi

cd "$(dirname "$0")"
apk update
xargs apk add --no-cache < packages.txt
echo "A04e first-boot tools installed successfully."
EOF
          chmod +x bundle/install.sh

      - name: Create compressed bundle
        run: |
          set -eu
          tar -czf A04e-first-boot-tools.tar.gz -C bundle .
          sha256sum A04e-first-boot-tools.tar.gz > A04e-first-boot-tools.tar.gz.sha256
          ls -lh A04e-first-boot-tools.tar.gz A04e-first-boot-tools.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A04e-first-boot-tools
          path: |
            A04e-first-boot-tools.tar.gz
            A04e-first-boot-tools.tar.gz.sha256
          if-no-files-found: error
