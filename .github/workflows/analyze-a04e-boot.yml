name: Analyze A04e stock boot image

on:
  push:
    branches: [a04e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified stock boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          curl -fL --retry 3 -o input/A04e-stock-boot.img \
            https://github.com/TEMMC/android_kernel_a042f/releases/download/a04e-stock-boot-20260929/A04e-stock-boot.img
          sha256sum input/A04e-stock-boot.img
          test "$(sha256sum input/A04e-stock-boot.img | cut -d' ' -f1)" = "797db41a6d3cfe9056db60e841b852c76206b01d4715ff58331f2b8b9fc86a80"

      - name: Inspect Android boot header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          p='input/A04e-stock-boot.img'
          with open(p,'rb') as f:
              h=f.read(64)
          print('magic:', h[:8])
          if h[:8] != b'ANDROID!':
              raise SystemExit('Not an Android boot image')
          vals=struct.unpack_from('<10I', h, 8)
          print('kernel_size:', vals[0])
          print('ramdisk_size:', vals[1])
          print('second_size:', vals[2])
          print('page_size:', vals[4])
          print('header_version:', vals[7])
          print('os_version_field:', hex(vals[8]))
          PY
          file input/A04e-stock-boot.img
          ls -lh input/A04e-stock-boot.img

      - name: Upload verified boot inspection
        uses: actions/upload-artifact@v4
        with:
          name: A04e-stock-boot-analysis
          path: input/A04e-stock-boot.img
          retention-days: 30
