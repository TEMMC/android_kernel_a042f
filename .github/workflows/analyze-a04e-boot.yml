name: Analyze A04e stock boot image

on:
  push:
    branches:
      - a04e
  workflow_dispatch:

jobs:
  analyze-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv curl xz-utils

      - name: Download verified stock boot
        run: |
          set -eux
          mkdir -p input
          curl -L --fail --retry 3 \
            -o input/A04e-stock-boot.img \
            https://github.com/TEMMC/android_kernel_a042f/releases/download/a04e-stock-boot-20260929/A04e-stock-boot.img
          sha256sum input/A04e-stock-boot.img
          test "$(sha256sum input/A04e-stock-boot.img | cut -d' ' -f1)" = "797db41a6d3cfe9056db60e841b852c76206b01d4715ff58331f2b8b9fc86a80"

      - name: Install current pmbootstrap
        run: |
          set -eux
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Create pmbootstrap config
        run: |
          set -eux
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$WORK/cache_git/pmaports"
          CONFIG="$RUNNER_TEMP/pmbootstrap.cfg"
          mkdir -p "$WORK/cache_git"
          printf '%s\n' '8' > "$WORK/version"
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmaports.git "$APORTS"
          cat > "$CONFIG" <<EOF
[pmbootstrap]
aports = $APORTS
work = $WORK
device = qemu-aarch64
kernel = stable
user = root
ui = console
extra_packages = none
build_pkgs_on_install = False
is_default_channel = False
locale = en_US.UTF-8
mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
mirrors_postmarketOS = http://mirror.postmarketos.org/postmarketos/
nonfree_firmware = False
nonfree_userland = False
ssh_keys = False
[providers]
[pmaports]
supported_arches = aarch64
EOF

      - name: Analyze Android boot image
        run: |
          set -eux
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$WORK/cache_git/pmaports"
          CONFIG="$RUNNER_TEMP/pmbootstrap.cfg"
          pmbootstrap -c "$CONFIG" -p "$APORTS" bootimg_analyze input/A04e-stock-boot.img > input/bootimg-analysis.txt 2>&1
          cat input/bootimg-analysis.txt

      - name: Upload boot analysis
        uses: actions/upload-artifact@v4
        with:
          name: A04e-stock-boot-analysis
          path: |
            input/A04e-stock-boot.img
            input/bootimg-analysis.txt
          retention-days: 30
