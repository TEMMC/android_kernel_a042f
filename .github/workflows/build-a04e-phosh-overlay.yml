name: Build A04e Phosh mobile desktop compact overlay

on:
  push:
    branches:
      - a04e
  workflow_dispatch:

jobs:
  build-phosh-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A04e source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv openssl procps psmisc tar xz-utils zstd kpartx util-linux e2fsprogs qemu-user-static binfmt-support rsync

      - name: Install current pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Configure ARM64 postmarketOS
        run: |
          set -eux
          APORTS="$RUNNER_TEMP/pmaports"
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmaports.git "$APORTS"

          make_config() {
            local config="$1"
            local work="$2"
            mkdir -p "$work"
            printf '%s\n' '8' > "$work/version"
            cat > "$config" <<EOF
          [pmbootstrap]
          aports = $APORTS
          work = $work
          device = qemu-aarch64
          kernel = stable
          user = root
          ui = console
          extra_packages = none
          build_pkgs_on_install = False
          is_default_channel = False
          locale = en_US.UTF-8
          mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
          mirrors_postmarketOS = http://mirror.postmarketos.org/postmarketos/
          nonfree_firmware = False
          nonfree_userland = False
          ssh_keys = False
          [providers]
          [pmaports]
          supported_arches = aarch64
          EOF
          }

          make_config "$RUNNER_TEMP/pmbootstrap-base.cfg" "$RUNNER_TEMP/pmbootstrap-base-work"
          make_config "$RUNNER_TEMP/pmbootstrap-phosh.cfg" "$RUNNER_TEMP/pmbootstrap-phosh-work"

      - name: Build exact base and Phosh trees
        run: |
          set -eux
          APORTS="$RUNNER_TEMP/pmaports"
          BASE_WORK="$RUNNER_TEMP/pmbootstrap-base-work"
          PHOSH_WORK="$RUNNER_TEMP/pmbootstrap-phosh-work"
          BASE_CONFIG="$RUNNER_TEMP/pmbootstrap-base.cfg"
          PHOSH_CONFIG="$RUNNER_TEMP/pmbootstrap-phosh.cfg"

          pmbootstrap -c "$BASE_CONFIG" -p "$APORTS" install --no-image --filesystem ext4 --password "pmos-test" --add "openssh,networkmanager"

          pmbootstrap -c "$PHOSH_CONFIG" -p "$APORTS" install --no-image --filesystem ext4 --password "pmos-test" --add "openssh,networkmanager,postmarketos-ui-phosh,postmarketos-ui-phosh-systemd,postmarketos-ui-phosh-default-osk,bluez,libinput,libinput-tools,evtest,gnome-console,firefox-esr,nautilus,file-roller,gnome-calculator,gnome-text-editor"

          BASE="$BASE_WORK/chroot_rootfs_qemu-aarch64"
          PHOSH="$PHOSH_WORK/chroot_rootfs_qemu-aarch64"
          test -d "$BASE"
          test -d "$PHOSH"

          sudo chroot "$PHOSH" /bin/sh -c 'echo "root:pmos-test" | chpasswd; passwd -u root || true'

          for p in postmarketos-ui-phosh postmarketos-ui-phosh-systemd postmarketos-ui-phosh-default-osk networkmanager bluez libinput libinput-tools evtest gnome-console firefox-esr nautilus file-roller gnome-calculator gnome-text-editor; do
            sudo chroot "$PHOSH" /bin/sh -c "apk info -e $p"
          done
          sudo chroot "$PHOSH" /bin/sh -c 'command -v phosh-session'
          test -f "$PHOSH/etc/os-release"
          test -d "$PHOSH/lib/apk/db"

      - name: Create compact Phosh delta overlay
        run: |
          set -eux
          BASE="$RUNNER_TEMP/pmbootstrap-base-work/chroot_rootfs_qemu-aarch64"
          PHOSH="$RUNNER_TEMP/pmbootstrap-phosh-work/chroot_rootfs_qemu-aarch64"
          OVERLAY="$RUNNER_TEMP/phosh-overlay"
          rm -rf "$OVERLAY"
          sudo mkdir -p "$OVERLAY"

          sudo rsync -aHAX --numeric-ids --compare-dest="$BASE"             --exclude='/proc/***'             --exclude='/sys/***'             --exclude='/dev/***'             --exclude='/run/***'             --exclude='/var/cache/***'             --exclude='/var/log/***'             --exclude='/tmp/***'             "$PHOSH"/ "$OVERLAY"/

          sudo mkdir -p "$OVERLAY/proc" "$OVERLAY/sys" "$OVERLAY/dev" "$OVERLAY/run"

          test -f "$OVERLAY/etc/apk/world"
          test -f "$OVERLAY/etc/shadow"
          test -e "$OVERLAY/usr/bin/phosh-session" -o -e "$OVERLAY/usr/bin/phosh"

          sudo mkdir -p out
          sudo tar -C "$OVERLAY" -cJf out/A04e-phosh-mobile-desktop-compact-overlay.tar.xz .
          sudo chown "$USER":"$USER" out/A04e-phosh-mobile-desktop-compact-overlay.tar.xz
          sha256sum out/A04e-phosh-mobile-desktop-compact-overlay.tar.xz
          du -h out/A04e-phosh-mobile-desktop-compact-overlay.tar.xz

      - name: Upload compact Phosh overlay
        uses: actions/upload-artifact@v4
        with:
          name: A04e-Phosh-mobile-desktop-compact-overlay
          path: out/A04e-phosh-mobile-desktop-compact-overlay.tar.xz
          if-no-files-found: error
          retention-days: 30
