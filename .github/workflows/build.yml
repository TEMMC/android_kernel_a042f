name: A04e Kernel and Boot Image

on:
  push:
    branches:
      - a04e
      - postmarketos-a04e
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (leave blank to build an artifact only)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: a04e-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex gcc-aarch64-linux-gnu libelf-dev libncurses-dev libssl-dev lld llvm clang make python3 rsync

      - name: Validate required build inputs
        run: |
          set -euxo pipefail
          test -f build_kernel.sh
          test -f AIK-Linux/repackimg.sh
          test -x AIK-Linux/repackimg.sh
          test -f AIK-Linux/split_img/boot.img-dtb
          test -f AIK-Linux/split_img/boot.img-ramdisk.cpio.gz
          test -f arch/arm64/configs/a04e_defconfig
          command -v clang
          command -v aarch64-linux-gnu-gcc
          echo "Build inputs found."

      - name: Compile kernel and repack A04e boot image
        run: bash build_kernel.sh

      - name: Verify output
        run: |
          set -euxo pipefail
          test -s build/A04e-postmarketOS-boot.img
          test -s build/A04e-postmarketOS-boot.tar
          tar -tf build/A04e-postmarketOS-boot.tar
          sha256sum -c build/SHA256SUMS
          file build/A04e-postmarketOS-boot.img
          echo "Boot image output verified."

      - name: Upload boot-image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A04e-postmarketOS-boot-${{ github.sha }}
          path: |
            build/A04e-postmarketOS-boot.img
            build/A04e-postmarketOS-boot.tar
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          name: A04e boot image ${{ inputs.tag }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: build/A04e-postmarketOS-boot.img,build/A04e-postmarketOS-boot.tar,build/SHA256SUMS
          body: "Built from commit ${{ github.sha }} on branch ${{ github.ref_name }}. Bootability with the custom super image has not been confirmed until device testing."
