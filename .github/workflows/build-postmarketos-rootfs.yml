name: Build postmarketOS A04e userspace

on:
  push:
    branches:
      - a04e
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A04e source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-venv openssl \
            procps psmisc tar xz-utils zstd kpartx util-linux \
            e2fsprogs qemu-user-static binfmt-support rsync

      - name: Install current pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Configure postmarketOS ARM64 environment
        run: |
          set -eux
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$WORK/cache_git/pmaports"
          CONFIG="$RUNNER_TEMP/pmbootstrap-aarch64.cfg"
          mkdir -p "$WORK/cache_git"
          printf '%s\n' '8' > "$WORK/version"

          cat > "$CONFIG" <<EOF
          [pmbootstrap]
          aports = $APORTS
          work = $WORK
          device = qemu-aarch64
          kernel = stable
          user = root
          ui = console
          extra_packages = none
          build_pkgs_on_install = False
          is_default_channel = False
          locale = en_US.UTF-8
          mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
          mirrors_postmarketOS = http://mirror.postmarketos.org/postmarketos/
          nonfree_firmware = False
          nonfree_userland = False
          ssh_keys = False
          [providers]
          [pmaports]
          supported_arches = aarch64
          EOF

          git clone --depth=1 https://gitlab.postmarketOS.org/postmarketOS/pmaports.git "$APORTS"
          pmbootstrap -c "$CONFIG" -p "$APORTS" status

      - name: Build postmarketOS ARM64 rootfs only
        run: |
          set -eux
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$WORK/cache_git/pmaports"
          CONFIG="$RUNNER_TEMP/pmbootstrap-aarch64.cfg"
          pmbootstrap -c "$CONFIG" -p "$APORTS" install \
            --no-image \
            --filesystem ext4 \
            --password "pmos-test" \
            --add "openssh,networkmanager"

      - name: Prepare native rootfs credentials and firmware path
        run: |
          set -eux
          ROOTFS="$(find "$RUNNER_TEMP/pmbootstrap-work" -maxdepth 1 -type d -name 'chroot_rootfs_qemu-aarch64' | head -n1)"
          test -n "$ROOTFS"
          sudo chroot "$ROOTFS" /bin/sh -c 'echo "root:pmos-test" | chpasswd; passwd -u root || true'
          sudo mkdir -p "$ROOTFS/lib/firmware"
          printf '%s\n' 'A04e native rootfs: device/vendor firmware must be supplied separately before hardware bring-up.' | sudo tee "$ROOTFS/lib/firmware/README.A04E" >/dev/null
          sudo awk -F: '$1 == "root" {print $2}' "$ROOTFS/etc/shadow" | grep -qv '^!'
      - name: Package rootfs
        run: |
          set -eux
          ROOTFS="$(find "$RUNNER_TEMP/pmbootstrap-work" -maxdepth 1 -type d -name 'chroot_rootfs_qemu-aarch64' | head -n1)"
          test -n "$ROOTFS"
          test -f "$ROOTFS/etc/os-release"

          STAGE="$RUNNER_TEMP/rootfs-stage"
          rm -rf "$STAGE"
          sudo mkdir -p "$STAGE"

          sudo rsync -aHAX --numeric-ids \
            --exclude='/proc/***' \
            --exclude='/sys/***' \
            --exclude='/dev/***' \
            --exclude='/run/***' \
            "$ROOTFS"/ "$STAGE"/

          sudo mkdir -p "$STAGE/proc" "$STAGE/sys" "$STAGE/dev" "$STAGE/run"

          sudo mkdir -p out
          sudo tar -C "$STAGE" -cJf out/postmarketos-a04e-arm64-rootfs.tar.xz .
          sudo chown "$USER":"$USER" out/postmarketos-a04e-arm64-rootfs.tar.xz
          du -h out/postmarketos-a04e-arm64-rootfs.tar.xz
          tar -tJf out/postmarketos-a04e-arm64-rootfs.tar.xz | head -40

      - name: Upload postmarketOS rootfs
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-A04e-ARM64-rootfs
          path: out/postmarketos-a04e-arm64-rootfs.tar.xz
          if-no-files-found: error
          retention-days: 30

  build-first-boot-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Build first-boot tools bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cat > bundle/packages.txt <<'EOF'
bash
curl
wget
git
nano
vim
tar
unzip
zip
xz
gzip
bzip2
file
rsync
lsof
procps
htop
util-linux
e2fsprogs
iproute2
usbutils
pciutils
openssh-client
ca-certificates
mpv
zathura
zathura-pdf-poppler
imv
EOF
          cat > bundle/install.sh <<'EOF'
#!/bin/sh
set -eu
if [ "$(id -u)" -ne 0 ]; then
  echo "Run as root: ./install.sh"
  exit 1
fi
command -v apk >/dev/null 2>&1 || {
  echo "ERROR: apk not found. This bundle is for postmarketOS/Alpine Linux."
  exit 1
}
cd "$(dirname "$0")"
apk update
xargs apk add --no-cache < packages.txt
echo "A04e first-boot tools installed."
EOF
          chmod +x bundle/install.sh
          tar -czf A04e-first-boot-tools.tar.gz -C bundle .
          sha256sum A04e-first-boot-tools.tar.gz > A04e-first-boot-tools.tar.gz.sha256
          ls -lh A04e-first-boot-tools.tar.gz A04e-first-boot-tools.tar.gz.sha256

      - name: Upload first-boot tools
        uses: actions/upload-artifact@v4
        with:
          name: A04e-first-boot-tools
          path: |
            A04e-first-boot-tools.tar.gz
            A04e-first-boot-tools.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
