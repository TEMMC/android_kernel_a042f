name: Build postmarketOS A04e userspace

on:
  push:
    branches:
      - a04e
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A04e source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-venv openssl \
            procps psmisc tar xz-utils zstd kpartx util-linux \
            e2fsprogs qemu-user-static binfmt-support

      - name: Install current pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$RUNNER_TEMP/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize postmarketOS ARM64 environment
        run: |
          set -eux
          APORTS="$RUNNER_TEMP/pmaports"
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          git clone --depth=1 --branch edge https://gitlab.postmarketOS.org/postmarketOS/pmaports.git "$APORTS"
          mkdir -p "$WORK"
          pmbootstrap --aports "$APORTS" --work "$WORK" -y init --shallow-initial-clone
          pmbootstrap --aports "$APORTS" --work "$WORK" config device qemu-aarch64
          pmbootstrap --aports "$APORTS" --work "$WORK" config kernel stable
          pmbootstrap --aports "$APORTS" --work "$WORK" config user root
          pmbootstrap --aports "$APORTS" --work "$WORK" config ui console
          pmbootstrap --aports "$APORTS" --work "$WORK" config extra_packages none
          pmbootstrap --aports "$APORTS" --work "$WORK" config build_pkgs_on_install False
          pmbootstrap --aports "$APORTS" --work "$WORK" status

      - name: Build postmarketOS ARM64 rootfs only
        run: |
          set -eux
          APORTS="$RUNNER_TEMP/pmaports"
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          pmbootstrap --aports "$APORTS" --work "$WORK" install \
            --no-image \
            --no-fde \
            --filesystem ext4 \
            --add "openssh,networkmanager"

      - name: Package rootfs
        run: |
          set -eux
          ROOTFS="$(find "$RUNNER_TEMP/pmbootstrap-work" -maxdepth 1 -type d -name 'chroot_rootfs_qemu-aarch64' | head -n1)"
          test -n "$ROOTFS"
          test -f "$ROOTFS/etc/os-release"
          mkdir -p out
          tar -C "$ROOTFS" -cJf out/postmarketos-a04e-arm64-rootfs.tar.xz .
          du -h out/postmarketos-a04e-arm64-rootfs.tar.xz
          tar -tJf out/postmarketos-a04e-arm64-rootfs.tar.xz | head -40

      - name: Upload postmarketOS rootfs
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-A04e-ARM64-rootfs
          path: out/postmarketos-a04e-arm64-rootfs.tar.xz
          if-no-files-found: error
          retention-days: 30
